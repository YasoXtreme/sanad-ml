# Student-size tournament (sanad.train.tournament --config configs/tournament_size.yaml).
# Same folds and teachers as configs/tournament.yaml; every student size is trained with no
# teacher and distilled from every teacher with the recipe that won the first tournament.
base_config: train.yaml

teachers:
  resnet:            {kind: resnet, lr: 0.001, epochs: 80, patience: 15}
  transformer_small: {kind: transformer, d_model: 128, heads: 4, layers: 4, ff: 256,
                      lr: 0.0005, weight_decay: 0.05, epochs: 120, patience: 25}
  transformer_large: {kind: transformer, d_model: 256, heads: 8, layers: 6, ff: 512,
                      lr: 0.0003, weight_decay: 0.05, epochs: 120, patience: 25}
  oxford_scratch:    {kind: oxford, pretrained: false, lr: 0.001, epochs: 80, patience: 15}
  oxford_pretrained: {kind: oxford, pretrained: true, lr: 0.0002, epochs: 60, patience: 15}

ensemble: [resnet, transformer_small, transformer_large, oxford_scratch, oxford_pretrained]

recipes:
  standard: {alpha: 0.5, temperature: 2.0}  # won for 5 of 6 teachers in tournament_v1

# Sanad-Tiny widened; same layers, so every size maps 1:1 to TFLite Micro int8 kernels
students:
  s12k:  {widths: [16, 32, 64],  kernels: [7, 5, 3], dense: 32}   # 11.8 k params, 0.72 M MACs (today's)
  s25k:  {widths: [24, 48, 96],  kernels: [7, 5, 3], dense: 48}   # 25.8 k params, 1.51 M MACs
  s50k:  {widths: [32, 64, 128], kernels: [7, 5, 3], dense: 64}   # 45.2 k params, 2.57 M MACs
  s100k: {widths: [48, 96, 176], kernels: [7, 5, 3], dense: 96}   # 93.8 k params, 5.33 M MACs

primary_metric: spec_at_target
