# Data pipeline: raw downloads (dvc add'ed) -> harmonized 50 Hz parquet per dataset.
#   uv run dvc repro            # rebuild whatever changed
#   uv run dvc push             # back up to D:\dvc-store\sanad-ml
stages:
  prepare_weda_fall:
    cmd: uv run --no-sync python -I -m sanad.data.prepare weda_fall
    deps:
      - data/raw/weda_fall
      - src/sanad/data/loaders/weda_fall.py
      - src/sanad/data/harmonize.py
    outs:
      - data/interim/weda_fall.parquet
  prepare_pamap2:
    cmd: uv run --no-sync python -I -m sanad.data.prepare pamap2
    deps:
      - data/raw/pamap2
      - src/sanad/data/loaders/pamap2.py
      - src/sanad/data/harmonize.py
    outs:
      - data/interim/pamap2.parquet
  prepare_fallalld:
    cmd: uv run --no-sync python -I -m sanad.data.prepare fallalld
    deps:
      - data/raw/fallalld
      - src/sanad/data/loaders/fallalld.py
      - src/sanad/data/harmonize.py
    outs:
      - data/interim/fallalld.parquet
  train_final:
    cmd: uv run --no-sync python -I -m sanad.train.train_final
    deps:
      - data/interim/weda_fall.parquet
      - data/interim/fallalld.parquet
      - data/interim/pamap2.parquet
      - configs/train.yaml
      - configs/deploy.yaml
      - src/sanad/eval/metrics.py
      - src/sanad/train/run_cv.py
      - src/sanad/data/windowing.py
      - src/sanad/data/augment.py
      - src/sanad/models
      - src/sanad/train/loop.py
      - src/sanad/train/train_final.py
      - src/sanad/export
    outs:
      - models/teacher.pt
      - models/student.pt
      - models/sanad_tiny_int8.tflite
      - models/final_report.json
      - models/firmware:
          cache: false  # small C files kept in git so the firmware team can use them directly
