; Sanad firmware v0.2: sensors streamed over Wi-Fi (WebSocket) and USB, Raspberry Pi Pico 2 W.
; Uses the community Raspberry Pi platform (the official one has no Pico 2 W) with the
; Arduino-Pico core by Earle Philhower.

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Extra warnings for our own files only (not the framework's).
build_src_flags = -Wall -Wextra
