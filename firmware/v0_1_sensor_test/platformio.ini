; Sanad firmware v0.1: sensor wiring test (MPU-6050 + MAX30102) on Raspberry Pi Pico 2 W.
; Uses the community Raspberry Pi platform (the official one has no Pico 2 W) with the
; Arduino-Pico core by Earle Philhower.

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
